version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: vride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vride
      POSTGRES_PASSWORD: vride123
      POSTGRES_DB: vride
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vride-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
